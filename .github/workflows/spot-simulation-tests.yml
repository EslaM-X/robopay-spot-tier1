name: Spot Simulation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy zenoh pytest
      - name: Fetch Spot model assets
        working-directory: simulation
        run: bash setup.sh
      - name: Skill acceptance
        working-directory: simulation/spot
        run: python3 test_spot_control.py
      - name: Payment gate
        working-directory: simulation/spot
        run: python3 test_payment_gate.py
